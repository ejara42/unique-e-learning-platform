<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Orbital Sphere Rings (Representing EduSphere) -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <ellipse cx="50" cy="54" rx="36" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.75" transform="rotate(-18 50 54)"/>

  <!-- Graduation Cap Center -->
  <g filter="url(#glow)">
    <!-- Cap Diamond -->
    <polygon points="50,28 78,40 50,52 22,40" fill="url(#capGrad)" />
    <!-- Cap Skull Base -->
    <path d="M32,46 L32,58 C32,66 68,66 68,58 L68,46 Z" fill="#60A5FA" opacity="0.95" />
    <!-- Tassel -->
    <path d="M72,42 L77,54 L80,66" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="67" r="2.5" fill="#FACC15" />
  </g>
</svg>
